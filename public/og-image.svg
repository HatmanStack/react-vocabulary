<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6200ee"/>
      <stop offset="100%" style="stop-color:#3700b3"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f5f5f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#7c4dff" opacity="0.3"/>
  <circle cx="1100" cy="530" r="200" fill="#7c4dff" opacity="0.2"/>
  <circle cx="900" cy="80" r="80" fill="#bb86fc" opacity="0.25"/>

  <!-- Main content card -->
  <rect x="80" y="140" width="500" height="350" rx="24" fill="url(#cardGradient)" opacity="0.95"/>

  <!-- Word cards stack effect -->
  <rect x="640" y="180" width="280" height="80" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="780" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6200ee" text-anchor="middle">ELOQUENT</text>

  <rect x="680" y="280" width="280" height="80" rx="12" fill="#ffffff" opacity="0.85"/>
  <text x="820" y="330" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#3700b3" text-anchor="middle">RESILIENT</text>

  <rect x="720" y="380" width="280" height="80" rx="12" fill="#ffffff" opacity="0.8"/>
  <text x="860" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6200ee" text-anchor="middle">PROFOUND</text>

  <!-- App icon placeholder -->
  <circle cx="160" cy="220" r="50" fill="#6200ee"/>
  <text x="160" y="235" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">V</text>

  <!-- Main title -->
  <text x="120" y="320" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a1a">Vocabulary</text>
  <text x="120" y="365" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6200ee">Learning App</text>

  <!-- Tagline -->
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="20" fill="#666666">Master 360+ words with</text>
  <text x="120" y="448" font-family="Arial, sans-serif" font-size="20" fill="#666666">interactive quizzes</text>

  <!-- Features -->
  <circle cx="135" y="485" r="8" fill="#03dac6"/>
  <text x="155" y="490" font-family="Arial, sans-serif" font-size="16" fill="#1a1a1a">18 Themed Lists</text>

  <circle cx="310" y="485" r="8" fill="#03dac6"/>
  <text x="330" y="490" font-family="Arial, sans-serif" font-size="16" fill="#1a1a1a">Track Progress</text>

  <!-- Bottom accent -->
  <rect x="0" y="610" width="1200" height="20" fill="#03dac6"/>
</svg>
